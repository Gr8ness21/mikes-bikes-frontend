<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mike's Bikes Transportation Services — emergency and scheduled motorcycle transport in Atlanta. We'll Come Get You!"
    />
    <title>Mike's Bikes | Transportation Services</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=Kaushan+Script&family=Barlow:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      #intro-gate {
        position: fixed;
        inset: 0;
        z-index: 200;
        background: #000;
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      #intro-gate video {
        width: min(420px, 72vmin);
        height: min(420px, 72vmin);
        object-fit: contain;
        pointer-events: none;
      }
      .intro-progress {
        position: absolute;
        left: 12%;
        right: 12%;
        bottom: 10%;
        height: 3px;
        border-radius: 99px;
        background: #ffffff22;
        overflow: hidden;
      }
      .intro-progress span {
        display: block;
        height: 100%;
        width: 0%;
        background: #e10600;
      }
    </style>
  </head>
  <body>
    <div id="intro-gate" class="intro-gate" aria-hidden="true">
      <video
        id="intro-video"
        autoplay
        muted
        playsinline
        webkit-playsinline
        preload="auto"
        disablepictureinpicture
      >
        <source src="/intro.mp4" type="video/mp4" />
      </video>
      <div class="intro-progress" aria-hidden="true">
        <span id="intro-progress-bar"></span>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var video = document.getElementById('intro-video');
        if (!video) return;
        video.muted = true;
        video.defaultMuted = true;
        video.playsInline = true;
        video.setAttribute('muted', '');
        video.setAttribute('playsinline', '');
        video.setAttribute('webkit-playsinline', 'true');
        var bar = document.getElementById('intro-progress-bar');
        var play = function () {
          var p = video.play();
          if (p && p.catch) p.catch(function () {});
        };
        play();
        video.addEventListener('loadeddata', play);
        video.addEventListener('canplay', play);
        video.addEventListener('timeupdate', function () {
          if (!bar || !video.duration) return;
          bar.style.width = Math.min(100, (100 * video.currentTime) / video.duration) + '%';
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
